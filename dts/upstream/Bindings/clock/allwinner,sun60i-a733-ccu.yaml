%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/allwinner,sun60i-a733-ccu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A733 Clock Control Unit

maintainers:
  - Alastair D'Silva <alastair@d-silva.org>

properties:
  "#clock-cells":
    const: 1

  "#reset-cells":
    const: 1

  compatible:
    enum:
      - allwinner,sun60i-a733-ccu
      - allwinner,sun60i-a733-r-ccu

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

required:
  - "#clock-cells"
  - "#reset-cells"
  - compatible
  - reg
  - clocks
  - clock-names

allOf:
  - if:
      properties:
        compatible:
          enum:
            - allwinner,sun60i-a733-ccu

    then:
      properties:
        clocks:
          items:
            - description: High Frequency Oscillator (usually at 24MHz)
            - description: Low Frequency Oscillator (usually at 32kHz)
            - description: Internal Oscillator

        clock-names:
          items:
            - const: hosc
            - const: losc
            - const: iosc

  - if:
      properties:
        compatible:
          enum:
            - allwinner,sun60i-a733-r-ccu

    then:
      properties:
        clocks:
          items:
            - description: High Frequency Oscillator (usually at 24MHz)
            - description: Low Frequency Oscillator (usually at 32kHz)

        clock-names:
          items:
            - const: hosc
            - const: losc

additionalProperties: false

examples:
  - |
    clock-controller@2002000 {
        compatible = "allwinner,sun60i-a733-ccu";
        reg = <0x02002000 0x1000>;
        clocks = <&dcxo24M>, <&rtc_ccu 0>, <&r_ccu 2>;
        clock-names = "hosc", "losc", "iosc";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };

...
